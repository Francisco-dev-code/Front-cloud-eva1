<h2 mat-dialog-title>{{ esEdicion ? 'Editar autor' : 'Nuevo autor' }}</h2>

<form [formGroup]="formulario" (ngSubmit)="guardar()">
  <mat-dialog-content class="campos">
    <mat-form-field appearance="outline" class="campo-completo">
      <mat-label>Nombre</mat-label>
      <input matInput formControlName="nombre" maxlength="80" />
      @if (formulario.get('nombre')?.hasError('required')) {
        <mat-error>El nombre es obligatorio</mat-error>
      }
    </mat-form-field>

    <mat-form-field appearance="outline" class="campo-completo">
      <mat-label>Apellido</mat-label>
      <input matInput formControlName="apellido" maxlength="80" />
      @if (formulario.get('apellido')?.hasError('required')) {
        <mat-error>El apellido es obligatorio</mat-error>
      }
    </mat-form-field>

    <mat-form-field appearance="outline" class="campo-completo">
      <mat-label>Nacionalidad</mat-label>
      <input matInput formControlName="nacionalidad" />
    </mat-form-field>

    <mat-form-field appearance="outline" class="campo-completo">
      <mat-label>Fecha de nacimiento</mat-label>
      <input matInput [matDatepicker]="picker" formControlName="fechaNacimiento" />
      <mat-datepicker-toggle matIconSuffix [for]="picker"></mat-datepicker-toggle>
      <mat-datepicker #picker></mat-datepicker>
    </mat-form-field>

    <mat-form-field appearance="outline" class="campo-completo">
      <mat-label>Biografía</mat-label>
      <textarea matInput formControlName="biografia" rows="3"></textarea>
    </mat-form-field>
  </mat-dialog-content>

  <mat-dialog-actions align="end">
    <button mat-button type="button" [mat-dialog-close]="null">Cancelar</button>
    <button mat-flat-button color="primary" type="submit">Guardar</button>
  </mat-dialog-actions>
</form>
